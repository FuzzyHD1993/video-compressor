services:
  video-compressor:
    build: .
    image: video-compressor:latest
    container_name: nas-video-compressor
    ports:
      - "8095:8080"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
      - PORT=8080
      - BIND_ADDR=0.0.0.0
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH:-}
      - NO_BROWSER=1
      - MAX_WORKERS=2
    volumes:
      - ./output:/app/output
      - ./temp:/app/temp
    # Docker (NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    # Podman (CDI): nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    # Some cgroup v2 hosts inherit a low PID limit; the Go runtime needs to
    # spawn threads and ffmpeg child processes.
    pids_limit: 4096
    restart: unless-stopped
